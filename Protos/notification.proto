syntax = "proto3";

import "Protos/common.proto";
option csharp_namespace = "core";

package notification;

service Notification {
  rpc GetCountByOwner (GetCountByOwnerRequest) returns (common.defaultReply);
  rpc GetNotificationListByOwner (GetNotificationListByOwnerRequest) returns (common.defaultReply);
  rpc SetNotificationRead (SetNotificationReadRequest) returns (common.defaultReply);
  rpc CreateNotification (NotificationRequest) returns (common.defaultReply);
  rpc RemoveNotification(RemoveNotificationRequst) returns (common.defaultReply);
}

message GetCountByOwnerRequest {
  string ownerid = 1;
}

message GetCountByOwnerReply {
  int32 count = 1;
}

message GetNotificationListByOwnerRequest {
  string ownerid = 1;
}

message GetNotificationListByOwnerReply {
  repeated notificationentity notifications = 1;
}

message notificationentity{
	string title =1;
    string body =2;
    string viewedat =3;
    string status =4;
    string id = 5;
    string createdat = 6;
}

message SetNotificationReadRequest{
    string ownerid = 1;
    string messageid =2 ;
}

message SetNotificationReadResponse{
    bool result = 1;
}

message NotificationRequest{
    string email = 1;
    string title = 2;
    string body = 3;
    int32 role = 4;
}

message RemoveNotificationRequst{
    string notificationId = 1;
}