syntax = "proto3";

import "Protos/common.proto";
option csharp_namespace = "core";

package leads;

// Leads captados fora do app, qualificados por tipo (docs/specs/leads-consultores-landing.md). Hoje só "Consultor".
service Leads {
  rpc CreateLead (CreateLeadRequest) returns (common.defaultReply);
  rpc ListLeads (ListLeadsRequest) returns (common.defaultReply);
}

message CreateLeadRequest {
  string kind = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
  bool consent = 5;
  string consentTextVersion = 6;
  string consentText = 7;
  string source = 8;
}

message ListLeadsRequest {
  string kind = 1;
}

message leadEntry {
  string id = 1;
  string kind = 2;
  string name = 3;
  string email = 4;
  string phone = 5;
  string consentedAt = 6;
  string consentTextVersion = 7;
  string source = 8;
  string createdAt = 9;
  string notifiedAt = 10;
}

message ListLeadsReply {
  repeated leadEntry items = 1;
}
