syntax = "proto3";

import "Protos/common.proto";
option csharp_namespace = "core";

package consultantdeletion;

// O pedido de exclusão de conta do CONSULTOR e o que, no core, ainda impede concluí-la (docs/specs/exclusao-de-conta-consultor.md, D-EC1, D-EC4 e D-EC9). Só o consultant-bff chama isto, depois de
// conferir que o token é do próprio consultor. Os impedimentos da carteira (saldo e saque pendente) o BFF lê na core-wallet.
// Erros: 400 (palavra de confirmação errada), 403 (a conta não é de consultor), 404 (conta não encontrada), 409 (conta já excluída).
service ConsultantDeletion {
  // O estado do pedido e o que impede, mesmo sem pedido (a tela mostra o que falta antes de a pessoa pedir).
  rpc GetStatus (CdProfileRequest) returns (common.defaultReply);
  // Pede com a carência de 7 dias. Idempotente: pedir de novo não renova o prazo.
  rpc Request (CdRequest) returns (common.defaultReply);
  // Cancela (também é o que o login faz). Sem pedido, não faz nada.
  rpc Cancel (CdProfileRequest) returns (common.defaultReply);
  // A EXECUÇÃO (EC2). IRREVERSÍVEIS e atrás de uma trava própria do core (ConsultantDeletion:ExecutionEnabled, desligada por padrão: 501). EraseData apaga os dados do consultor e NÃO toca no
  // perfil; Complete anonimiza o perfil e grava a data (só depois de EraseData). Ambos reconferem tudo (pedido, carência, acesso depois do pedido, atendimentos) e são idempotentes.
  // Erros: 403 (não é consultor), 404 (não existe), 409 (uma pré-condição barrou: a mensagem diz qual), 501 (trava desligada).
  rpc EraseData (CdProfileRequest) returns (common.defaultReply);
  rpc Complete (CdProfileRequest) returns (common.defaultReply);
  // Os pedidos vencidos a executar (só os ids), para o job diário. Só leitura, mas atrás da MESMA trava da execução (501 desligada).
  rpc ListDue (CdDueRequest) returns (common.defaultReply);
}

message CdProfileRequest {
  string profileId = 1;
}

message CdRequest {
  string profileId = 1;
  string confirmation = 2;
}

// O que EraseData fez (só contagens, nada que identifique alguém). alreadyCompleted: a conta já estava excluída e nada foi feito.
message CdErasureReply {
  bool alreadyCompleted = 1;
  bool consultantFound = 2;
  int32 availabilities = 3;
  int32 offerings = 4;
  int32 reviews = 5;
  int32 tratativas = 6;
  int32 connectionsAnonymized = 7;
  int32 conversationsClosed = 8;
  int32 conversationsAnonymized = 9;
  int32 notifications = 10;
  int32 tutorialRecords = 11;
  int32 leads = 12;
  int32 silencingsRemoved = 13;
  // Documentos pessoais do Elasticsearch apagados.
  int32 documents = 14;
}

message CdEmptyReply {}

message CdDueRequest {
  // De 1 a 100; 0 usa 100.
  int32 take = 1;
}

message CdDueReply {
  repeated string profileIds = 1;
}

message CdStatusReply {
  bool requested = 1;
  // ISO 8601 em UTC; vazio sem pedido.
  string requestedAt = 2;
  string scheduledFor = 3;
  bool completed = 4;
  // Atendimentos pagos por talentos que ainda não terminaram.
  int32 openEngagements = 5;
  // Sessões futuras não canceladas.
  int32 futureSessions = 6;
  // Esta chamada MUDOU o pedido (Request gravou um pedido novo; Cancel cancelou um existente). Sempre falso em GetStatus.
  bool changed = 7;
}
