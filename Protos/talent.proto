syntax = "proto3";

option csharp_namespace = "core";

import "Protos/common.proto";
import "Protos/consultant.proto";

package talent;


service Talent {
  rpc ListConsultants (FilterRequest) returns (common.defaultReply);
  rpc Connect (ConnectRequest) returns (common.defaultReply);
  rpc SearchProfiles (SearchProfilesRequest) returns (common.defaultReply);
  rpc PublishResumeUploadedEvent (.consultant.PublishResumeUploadedEventRequest) returns (common.defaultReply);
  rpc SetResumeData (.consultant.SetResumeDataRequest) returns (common.defaultReply);
  rpc GetResumeData (.consultant.OwnerIdRequest) returns (common.defaultReply);
  rpc EnsureProfile (EnsureProfileRequest) returns (common.defaultReply);
  rpc SuggestSummary (.consultant.OwnerIdRequest) returns (common.defaultReply);
}

message EnsureProfileRequest{
	string id = 1;
	string firstName = 2;
	string lastName = 3;
	string email = 4;
	string pictureUrl = 5;
}

message FilterRequest{
	string name = 1;
	string services = 2;
}

message ListConsultantsReply{

   repeated consultant consultants = 1;

}

message consultant {
	string name = 1;
	repeated string services = 2;
	repeated common.availability availabilities = 3;
	string id = 4;
	repeated string skills = 5;
	string pictureUrl = 6;
	optional string bio = 7;
}

message ConnectRequest{
	string candidateId = 1;
	string consultantId = 2;
	string candidateFirstName = 3;
	string candidateLastName = 4;
	optional string candidateEmail = 5;
	optional string candidatePictureUrl = 6;
	optional string candidateTelephoneCountryCode = 7;
	optional string candidateTelephoneAreaCode = 8;
	optional string candidateTelephoneNumber = 9;
}

message SearchProfilesRequest {
	string name = 1;
	string role = 2;
}

message profileSearchResult {
	string id = 1;
	string name = 2;
	string role = 3;
}

message SearchProfilesReply {
	repeated profileSearchResult items = 1;
}

// PublishResumeUploadedEventRequest, OwnerIdRequest, SetResumeDataRequest, GetResumeDataReply
// (e as mensagens contacts/identification/education/language/experience/experienceEntry que elas
// usam) já são definidas em core/Protos/consultant.proto, compilado no mesmo csharp_namespace
// "core" que este arquivo — reaproveitadas as mesmas classes geradas, não redefinidas aqui.
