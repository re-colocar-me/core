syntax = "proto3";

option csharp_namespace = "core";

import "Protos/common.proto";
import "Protos/consultant.proto";

package talent;


service Talent {
  rpc ListConsultants (FilterRequest) returns (common.defaultReply);
  rpc Connect (ConnectRequest) returns (common.defaultReply);
  rpc SearchProfiles (SearchProfilesRequest) returns (common.defaultReply);
  rpc PublishResumeUploadedEvent (.consultant.PublishResumeUploadedEventRequest) returns (common.defaultReply);
  rpc SetResumeData (.consultant.SetResumeDataRequest) returns (common.defaultReply);
  rpc GetResumeData (.consultant.OwnerIdRequest) returns (common.defaultReply);
  rpc EnsureProfile (EnsureProfileRequest) returns (common.defaultReply);
  rpc SuggestSummary (.consultant.OwnerIdRequest) returns (common.defaultReply);
  rpc GetTalentSkills (GetTalentSkillsRequest) returns (common.defaultReply);
  rpc SetTalentSkills (SetTalentSkillsRequest) returns (common.defaultReply);
  rpc SuggestSkills (GetTalentSkillsRequest) returns (common.defaultReply);
  rpc GetMyConnections (.consultant.OwnerIdRequest) returns (common.defaultReply);
  rpc GetConsultantDetails (ConsultantIdRequest) returns (common.defaultReply);
  rpc RemoveConnection (RemoveConnectionRequest) returns (common.defaultReply);
  rpc GenerateSwotAnalysis (GenerateSwotAnalysisRequest) returns (common.defaultReply);
  rpc GetSwotAnalysis (.consultant.OwnerIdRequest) returns (common.defaultReply);
  rpc GenerateSkillGapAnalysis (GenerateSkillGapAnalysisRequest) returns (common.defaultReply);
  rpc GetSkillGapAnalysis (.consultant.OwnerIdRequest) returns (common.defaultReply);
  rpc GenerateLinkedinSuggestion (.consultant.OwnerIdRequest) returns (common.defaultReply);
  rpc GetLinkedinSuggestion (.consultant.OwnerIdRequest) returns (common.defaultReply);
  rpc SuggestCoverLetter (SuggestCoverLetterRequest) returns (common.defaultReply);
  rpc SuggestInterviewQuestions (SuggestInterviewQuestionsRequest) returns (common.defaultReply);
  rpc SuggestInterviewFeedback (SuggestInterviewFeedbackRequest) returns (common.defaultReply);

  // docs/specs/compra-agendamento-servico-consultor.md
  rpc CreateServicePurchase (CreateServicePurchaseRequest) returns (common.defaultReply);
  rpc ListMyServicePurchases (CandidateIdRequest) returns (common.defaultReply);
  rpc ListServicePurchasesForConsultant (.consultant.OwnerIdRequest) returns (common.defaultReply);
  rpc ScheduleServiceSession (ScheduleServiceSessionRequest) returns (common.defaultReply);
  rpc GetServicePurchaseCancellationPreview (ServicePurchaseIdRequest) returns (common.defaultReply);
  rpc MarkServicePurchaseCanceled (ServicePurchaseIdRequest) returns (common.defaultReply);
  rpc ListMySchedules (CandidateIdRequest) returns (common.defaultReply);
  rpc GetBookedDatesForAvailability (AvailabilityIdRequest) returns (common.defaultReply);
}

message ConsultantIdRequest {
	string consultantId = 1;
}

message RemoveConnectionRequest {
	string candidateId = 1;
	string consultantId = 2;
}

message connectionSummary {
	string id = 1;
	string consultantId = 2;
	string consultantName = 3;
	string pictureUrl = 4;
	string connectedAt = 5;
}

message GetMyConnectionsReply {
	repeated connectionSummary connections = 1;
}

message GetConsultantDetailsReply {
	string id = 1;
	string name = 2;
	string pictureUrl = 3;
	optional string bio = 4;
	repeated string skills = 5;
	repeated common.service providedServices = 6;
	repeated common.availability weeklyAvailability = 7;
	repeated .consultant.sporadicavailabilityitem sporadicAvailability = 8;
}

message GetTalentSkillsRequest {
	string talentProfileId = 1;
}

message GetTalentSkillsReply {
	repeated string skillNames = 1;
}

message SetTalentSkillsRequest {
	string talentProfileId = 1;
	repeated string skillNames = 2;
}

message SuggestTalentSkillsReply {
	repeated string suggestedSkills = 1;
}

message EnsureProfileRequest{
	string id = 1;
	string firstName = 2;
	string lastName = 3;
	string email = 4;
	string pictureUrl = 5;
}

message FilterRequest{
	string name = 1;
	string services = 2;
}

message ListConsultantsReply{

   repeated consultant consultants = 1;

}

message consultant {
	string name = 1;
	repeated string services = 2;
	repeated common.availability availabilities = 3;
	string id = 4;
	repeated string skills = 5;
	string pictureUrl = 6;
	optional string bio = 7;
}

message ConnectRequest{
	string candidateId = 1;
	string consultantId = 2;
	string candidateFirstName = 3;
	string candidateLastName = 4;
	optional string candidateEmail = 5;
	optional string candidatePictureUrl = 6;
	optional string candidateTelephoneCountryCode = 7;
	optional string candidateTelephoneAreaCode = 8;
	optional string candidateTelephoneNumber = 9;
	bool shareSwotAnalysis = 10;
}

message GenerateSwotAnalysisRequest {
	string ownerId = 1;
	string vocationalSummary = 2;
}

message SwotAnalysisReply {
	bool found = 1;
	string analysisText = 2;
	optional string updatedAt = 3;
}

message GenerateSkillGapAnalysisRequest {
	string ownerId = 1;
	string vocationalSummary = 2;
}

message SkillGapAnalysisReply {
	bool found = 1;
	string analysisText = 2;
	optional string updatedAt = 3;
}

message LinkedinSuggestionReply {
	bool found = 1;
	string suggestionText = 2;
	optional string updatedAt = 3;
}

message SuggestCoverLetterRequest {
	string ownerId = 1;
	string jobDescription = 2;
}

message SuggestCoverLetterReply {
	string coverLetterText = 1;
}

message SuggestInterviewQuestionsRequest {
	string ownerId = 1;
	string targetRole = 2;
}

message SuggestInterviewQuestionsReply {
	repeated string questions = 1;
}

message interviewAnswer {
	string question = 1;
	string answer = 2;
}

message SuggestInterviewFeedbackRequest {
	string ownerId = 1;
	string targetRole = 2;
	repeated interviewAnswer answers = 3;
}

message SuggestInterviewFeedbackReply {
	string feedbackText = 1;
}

message SearchProfilesRequest {
	string name = 1;
	string role = 2;
}

message profileSearchResult {
	string id = 1;
	string name = 2;
	string role = 3;
}

message SearchProfilesReply {
	repeated profileSearchResult items = 1;
}

// PublishResumeUploadedEventRequest, OwnerIdRequest, SetResumeDataRequest, GetResumeDataReply
// (e as mensagens contacts/identification/education/language/experience/experienceEntry que elas
// usam) já são definidas em core/Protos/consultant.proto, compilado no mesmo csharp_namespace
// "core" que este arquivo — reaproveitadas as mesmas classes geradas, não redefinidas aqui.

// docs/specs/compra-agendamento-servico-consultor.md

message CandidateIdRequest {
	string candidateId = 1;
}

message ServicePurchaseIdRequest {
	string id = 1;
}

message CreateServicePurchaseRequest {
	string consultantId = 1;
	string offeringId = 2;
	string candidateId = 3;
	string candidateFirstName = 4;
	string candidateLastName = 5;
	optional string candidateEmail = 6;
	optional string candidatePictureUrl = 7;
	string walletDebitTransactionId = 8;
}

message CreateServicePurchaseReply {
	string id = 1;
	int32 totalSessions = 2;
}

message servicePurchaseEntry {
	string id = 1;
	string consultantId = 2;
	string consultantName = 3;
	string candidateName = 4;
	string offeringId = 5;
	string serviceName = 6;
	string format = 7;
	int32 totalSessions = 8;
	int32 usedSessions = 9;
	int64 unitPriceInLemonCoins = 10;
	int64 totalPriceInLemonCoins = 11;
	string purchasedAt = 12;
	string status = 13;
}

message ListMyServicePurchasesReply {
	repeated servicePurchaseEntry items = 1;
}

message ListServicePurchasesForConsultantReply {
	repeated servicePurchaseEntry items = 1;
}

message ScheduleServiceSessionRequest {
	string servicePurchaseId = 1;
	string candidateId = 2;
	optional string sourceAvailabilityId = 3;
	optional string weeklyDate = 4;
	optional string sourceSporadicAvailabilityId = 5;
}

message ScheduleServiceSessionReply {
	string scheduleId = 1;
}

message GetServicePurchaseCancellationPreviewReply {
	int32 unusedSessions = 1;
	int64 unitPriceInLemonCoins = 2;
	int64 grossAmountToRefundLemonCoins = 3;
	string walletDebitTransactionId = 4;
}

// Box de agendamentos do candidato no Feed (ajuste pedido pelo usuário) — Schedule não guarda
// CandidateId direto, só ServicePurchaseId; resolvido via join com ServicePurchase no TalentService.
message myScheduleEntry {
	string id = 1;
	string consultantName = 2;
	string dateTime = 3;
	string date = 4;
	string subject = 5;
	string status = 6;
}

message ListMySchedulesReply {
	repeated myScheduleEntry schedules = 1;
}

message AvailabilityIdRequest {
	string availabilityId = 1;
}

// Datas (yyyy-MM-dd) do template semanal já ocupadas por um agendamento ativo — removidas do
// seletor de data no popover de agendamento (talent-client), pra não deixar escolher uma data que
// o backend vai rejeitar por conflito.
message GetBookedDatesForAvailabilityReply {
	repeated string dates = 1;
}
