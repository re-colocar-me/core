syntax = "proto3";

option csharp_namespace = "core";

import "Protos/common.proto";

package consultantServices;

service ConsultantServices{
	rpc ListCategories (common.Empty) returns (common.defaultReply);
	rpc ListServicesByCategory (ListServicesByCategoryRequest) returns (common.defaultReply);
	rpc ListAllServices (common.Empty) returns (common.defaultReply);

	rpc CreateCategory (CreateCategoryRequest) returns (common.defaultReply);
	rpc UpdateCategory (UpdateCategoryRequest) returns (common.defaultReply);
	rpc SetCategoryActive (SetCategoryActiveRequest) returns (common.defaultReply);

	rpc CreateService (CreateServiceRequest) returns (common.defaultReply);
	rpc UpdateService (UpdateServiceRequest) returns (common.defaultReply);
	rpc SetServiceActive (SetServiceActiveRequest) returns (common.defaultReply);

	rpc SetCategorySkills (SetCategorySkillsRequest) returns (common.defaultReply);
	rpc SetServiceSkills (SetServiceSkillsRequest) returns (common.defaultReply);
	rpc SearchSkills (SearchSkillsRequest) returns (common.defaultReply);
	rpc GetEffectiveServiceSkills (GetEffectiveServiceSkillsRequest) returns (common.defaultReply);

	rpc SetConsultantSkills (SetConsultantSkillsRequest) returns (common.defaultReply);
	rpc GetConsultantSkills (GetConsultantSkillsRequest) returns (common.defaultReply);
	rpc SuggestSkills (GetConsultantSkillsRequest) returns (common.defaultReply);
	rpc GetCurationConfig (common.Empty) returns (common.defaultReply);
	rpc SetCurationConfig (SetCurationConfigRequest) returns (common.defaultReply);
}

message ListCategoriesReply{
	repeated category Categories = 1;
	int32 statuscode = 2;
	common.error error = 3;
}

message category{
	string name = 1;
	string description = 2;
	repeated common.service services = 3;
	string id = 4;
	bool isActive = 5;
	repeated string skillNames = 6;
}

message CreateCategoryRequest {
	string name = 1;
	string description = 2;
	string changedBy = 3;
}

message UpdateCategoryRequest {
	string id = 1;
	string name = 2;
	string description = 3;
	string changedBy = 4;
}

message SetCategoryActiveRequest {
	string id = 1;
	bool isActive = 2;
	string changedBy = 3;
}

message CreateServiceRequest {
	string categoryId = 1;
	string name = 2;
	string description = 3;
	string changedBy = 4;
}

message UpdateServiceRequest {
	string id = 1;
	string name = 2;
	string description = 3;
	string changedBy = 4;
}

message SetServiceActiveRequest {
	string id = 1;
	bool isActive = 2;
	string changedBy = 3;
}

message SetCategorySkillsRequest {
	string categoryId = 1;
	repeated string skillNames = 2;
	string changedBy = 3;
}

message SetServiceSkillsRequest {
	string serviceItemId = 1;
	repeated string skillNames = 2;
	string changedBy = 3;
}

message SearchSkillsRequest {
	string query = 1;
}

message SearchSkillsReply {
	repeated string skillNames = 1;
}

message GetEffectiveServiceSkillsRequest {
	string serviceItemId = 1;
}

message GetEffectiveServiceSkillsReply {
	repeated string skillNames = 1;
}

message ListServicesByCategoryRequest {
	string categoryId = 1;
}

message ListServicesByCategoryReply{
	repeated common.service services =1;	
}


message ListAllServicesReply{
	repeated common.service services =1;
	int32 statuscode = 2;
	common.error error = 3;
}

message SetConsultantSkillsRequest {
	string consultantProfileId = 1;
	repeated string skillNames = 2;
}

message GetConsultantSkillsRequest {
	string consultantProfileId = 1;
}

message GetConsultantSkillsReply {
	repeated string skillNames = 1;
}

message SuggestSkillsReply {
	repeated string suggestedSkills = 1;
}

message SetCurationConfigRequest {
	double minimumSkillMatchPercentage = 1;
	string changedBy = 2;
}

message GetCurationConfigReply {
	double minimumSkillMatchPercentage = 1;
}