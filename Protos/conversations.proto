syntax = "proto3";

import "Protos/common.proto";
option csharp_namespace = "core";

package conversations;

// A ponte talento-consultor, lado da mão levantada (docs/specs/ponte-talento-consultor.md, fatia P1). O erro vira statuscode com a mensagem:
// 400 regra ou pedido inválido, 404 não existe (ou não é desta pessoa), 409 já há conversa aberta com o consultor. Os nomes das mensagens levam o
// prefixo Conv porque o namespace C# é compartilhado com os outros protos do core.
service Conversations {
  rpc RaiseHand (ConvRaiseHandRequest) returns (common.defaultReply);
  // O consultor propõe um serviço da oferta dele; o preço vem da oferta cadastrada.
  rpc Propose (ConvProposeRequest) returns (common.defaultReply);
  // A primeira conversa grátis (seção 8): propor no lugar de um serviço, e a configuração e a cota do consultor.
  rpc ProposeFirstConversation (ConvConsultantActionRequest) returns (common.defaultReply);
  rpc GetFirstConversation (ConvFirstConversationRequest) returns (common.defaultReply);
  rpc SetFirstConversation (ConvSetFirstConversationRequest) returns (common.defaultReply);
  // O "meu público" do consultor (seção 9): os critérios gravados com a contagem, gravar, e só a contagem de critérios ainda não gravados (a tela mostra enquanto ele escolhe).
  rpc GetAudience (ConvAudienceRequest) returns (common.defaultReply);
  rpc SetAudience (ConvSetAudienceRequest) returns (common.defaultReply);
  rpc PreviewAudience (ConvAudiencePreviewRequest) returns (common.defaultReply);
  // O convite do consultor (seção 10): a visão (cota, modelos, vagas, contagens) e o envio. O consultor não escolhe ninguém; o servidor seleciona.
  rpc GetInviteOverview (ConvInviteOverviewRequest) returns (common.defaultReply);
  rpc SendInvites (ConvSendInvitesRequest) returns (common.defaultReply);
  // O talento e os convites (seção 11): preferências, "agora não", silenciar e desfazer o silêncio. Aceitar um convite é o Confirm de sempre.
  rpc GetInvitePreferences (ConvInvitePreferencesRequest) returns (common.defaultReply);
  rpc SetInvitePreferences (ConvSetInvitePreferencesRequest) returns (common.defaultReply);
  rpc DismissInvite (ConvCandidateActionRequest) returns (common.defaultReply);
  rpc SilenceInvite (ConvCandidateActionRequest) returns (common.defaultReply);
  rpc UnsilenceConsultant (ConvUnsilenceRequest) returns (common.defaultReply);
  // Denúncia (seção 13). O BFF fixa o papel (Candidate ou Consultant); a resposta NUNCA diz se a denúncia suspendeu alguém.
  rpc ReportConversation (ConvReportRequest) returns (common.defaultReply);
  rpc Decline (ConvConsultantActionRequest) returns (common.defaultReply);
  // O talento confirma: nasce a conexão e a identidade é revelada ao consultor.
  rpc Confirm (ConvConfirmRequest) returns (common.defaultReply);
  rpc Withdraw (ConvCandidateActionRequest) returns (common.defaultReply);
  rpc ListForCandidate (ConvListForCandidateRequest) returns (common.defaultReply);
  // A caixa do consultor NUNCA carrega o identificador do talento: só a ficha anônima e, depois do aceite, a conexão.
  rpc ListForConsultant (ConvListForConsultantRequest) returns (common.defaultReply);
}

message ConvRaiseHandRequest {
  string candidateId = 1;
  string consultantId = 2;
  optional string requestedOfferingId = 3;
  optional string note = 4;
  bool shareSuco = 5;
  optional string situation = 6;
  optional string timeSinceLayoffBand = 7;
  optional string seniority = 8;
  repeated string areasTop3 = 9;
  optional string sucoSummary = 10;
}

message ConvProposeRequest {
  string consultantId = 1;
  string conversationId = 2;
  string offeringId = 3;
}

message ConvConsultantActionRequest {
  string consultantId = 1;
  string conversationId = 2;
}

message ConvCandidateActionRequest {
  string candidateId = 1;
  string conversationId = 2;
}

message ConvConfirmRequest {
  string candidateId = 1;
  string conversationId = 2;
  string firstName = 3;
  string lastName = 4;
  optional string email = 5;
  optional string pictureUrl = 6;
  optional string telephoneCountryCode = 7;
  optional string telephoneAreaCode = 8;
  optional string telephoneNumber = 9;
}

message ConvListForCandidateRequest {
  string candidateId = 1;
}

message ConvListForConsultantRequest {
  string consultantId = 1;
  // HandRaised | Invite (vazio = todas)
  optional string origin = 2;
  // Raised | Proposed | Confirmed | Declined | Withdrawn | Expired ... (vazio = todos)
  optional string status = 3;
}

message ConvFirstConversationRequest {
  string consultantId = 1;
}

message ConvSetFirstConversationRequest {
  string consultantId = 1;
  bool enabled = 2;
  // 15 ou 30
  int32 durationMinutes = 3;
  // de 1 ao teto (10)
  int32 monthlyQuota = 4;
}

message ConvFirstConversationReply {
  bool enabled = 1;
  int32 durationMinutes = 2;
  int32 monthlyQuota = 3;
  int32 usedThisMonth = 4;
  // Já desconta as vagas confirmadas no mês.
  int32 remaining = 5;
}

message ConvAudienceCriterion {
  // "situation" ou "timeSinceLayoff" (os tipos que a plataforma sabe contar hoje).
  string kind = 1;
  repeated string values = 2;
}

message ConvAudienceRequest {
  // O id do PERFIL do consultor (traduzido para o Consultant.Id no core).
  string consultantId = 1;
}

message ConvSetAudienceRequest {
  string consultantId = 1;
  repeated ConvAudienceCriterion criteria = 2;
}

message ConvAudiencePreviewRequest {
  repeated ConvAudienceCriterion criteria = 1;
}

message ConvAudienceCountReply {
  // Abaixo do mínimo a contagem some: belowMinimum = true e value = 0.
  bool belowMinimum = 1;
  int32 value = 2;
  int32 minimum = 3;
}

message ConvAudienceReply {
  repeated ConvAudienceCriterion criteria = 1;
  repeated string supportedKinds = 2;
  int32 maxCriteria = 3;
  ConvAudienceCountReply count = 4;
}

message ConvInviteOverviewRequest {
  // O id do PERFIL do consultor (traduzido para o Consultant.Id no core).
  string consultantId = 1;
}

message ConvSendInvitesRequest {
  string consultantId = 1;
  string templateId = 2;
  // A frase própria do consultor (até 200 caracteres, sem contato); opcional.
  optional string freeText = 3;
  int32 count = 4;
}

message ConvInviteTemplate {
  string id = 1;
  string name = 2;
  string text = 3;
  bool isFirstConversation = 4;
}

message ConvInviteOverviewReply {
  int32 monthlyQuota = 1;
  int32 used = 2;
  int32 remaining = 3;
  // Consultor novo (primeiros 30 dias a contar do primeiro convite): cota menor.
  bool isNew = 4;
  repeated ConvInviteTemplate templates = 5;
  bool firstConversationEnabled = 6;
  int32 firstConversationMinutes = 7;
  // Já desconta as vagas reservadas por convites abertos.
  int32 firstConversationFreeSlots = 8;
  bool canInvite = 9;
  // O que falta para convidar (mensagens para a tela).
  repeated string missing = 10;
  // Quantas pessoas ele alcançaria; abaixo do mínimo o número some (reachableBelowMinimum = true e reachableValue = 0).
  bool reachableBelowMinimum = 11;
  int32 reachableValue = 12;
  int32 reachableMinimum = 13;
  // Contagens, sem identificar ninguém.
  int32 sent = 14;
  int32 open = 15;
  int32 accepted = 16;
  int32 dismissed = 17;
  int32 silenced = 18;
  int32 expired = 19;
  int32 freeTextMaxChars = 20;
}

message ConvSendInvitesReply {
  int32 requested = 1;
  // Pode ser menor que o pedido: se há menos elegíveis, só se envia o que há.
  int32 sent = 2;
  int32 quotaRemaining = 3;
}

message ConvInvitePreferencesRequest {
  string candidateId = 1;
}

message ConvSetInvitePreferencesRequest {
  string candidateId = 1;
  // Ausente não muda.
  optional bool receiveInvites = 2;
  // Verdadeiro registra que o aviso foi mostrado.
  optional bool noticeSeen = 3;
}

message ConvSilencedConsultant {
  string consultantId = 1;
  string name = 2;
  string pictureUrl = 3;
  string at = 4;
}

message ConvInvitePreferencesReply {
  bool receiveInvites = 1;
  bool noticeSeen = 2;
  repeated ConvSilencedConsultant silenced = 3;
  int32 maxPerWeek = 4;
}

message ConvUnsilenceRequest {
  string candidateId = 1;
  string consultantId = 2;
}

// reporterRole: "Candidate" (reporterId = id do perfil do talento) ou "Consultant" (reporterId = id do PERFIL do consultor, traduzido no core).
// reason: OutsideContact, Offensive, Misleading, Spam ou Other.
message ConvReportRequest {
  string reporterRole = 1;
  string reporterId = 2;
  string conversationId = 3;
  string reason = 4;
  optional string details = 5;
}

// created=false: este lado já tinha denunciado esta conversa.
message ConvReportReply {
  bool created = 1;
}

message ConvActionReply {
  string id = 1;
  string status = 2;
}

message ConvEventItem {
  string type = 1;
  string actor = 2;
  string at = 3;
}

message ConvCardItem {
  string situation = 1;
  string timeSinceLayoffBand = 2;
  string seniority = 3;
  repeated string areasTop3 = 4;
  string sucoSummary = 5;
}

// O que o talento vê: o consultor identificado desde o início (cartão público).
message ConvCandidateItem {
  string id = 1;
  string consultantId = 2;
  string consultantName = 3;
  string consultantPictureUrl = 4;
  string origin = 5;
  string status = 6;
  string createdAt = 7;
  string expiresAt = 8;
  string requestedOfferingId = 9;
  string proposalKind = 10;
  string proposedOfferingId = 11;
  int64 proposedPriceInLemonCoins = 12;
  string proposedServiceName = 13;
  string note = 14;
  bool shareSuco = 15;
  string connectionId = 16;
  repeated ConvEventItem events = 17;
  // Só no convite: o texto do modelo escolhido e o "combina com você porque" (fatos da própria pessoa).
  string inviteText = 18;
  string inviteReason = 19;
  // Só na última mão encerrada com um consultor, enquanto ela ainda impede um novo pedido: quando ele volta a valer. Vazio nas demais.
  string raiseAgainAt = 20;
}

message ConvCandidateListReply {
  repeated ConvCandidateItem items = 1;
  // Mãos levantadas em uso (esperando resposta ou proposta) e o teto ajustável no backoffice.
  int32 openHandRaises = 2;
  int32 maxOpenHandRaises = 3;
  // A espera, em dias, depois de uma mão encerrada (o app avisa antes de recusar uma proposta).
  int32 handRaiseRetryDays = 4;
}

// O que o consultor vê: a ficha anônima. NÃO há candidateId aqui, de propósito.
message ConvConsultantItem {
  string id = 1;
  string origin = 2;
  string status = 3;
  string createdAt = 4;
  string expiresAt = 5;
  string requestedOfferingId = 6;
  string proposalKind = 7;
  string proposedOfferingId = 8;
  int64 proposedPriceInLemonCoins = 9;
  string proposedServiceName = 10;
  string note = 11;
  ConvCardItem card = 12;
  // Só depois do aceite: a conexão por onde o consultor vê quem é a pessoa.
  string connectionId = 13;
  repeated ConvEventItem events = 14;
}

message ConvConsultantListReply {
  repeated ConvConsultantItem items = 1;
}
