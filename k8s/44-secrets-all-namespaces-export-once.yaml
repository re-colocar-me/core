# EXPORTAÇÃO ÚNICA dos Secrets de TODOS os namespaces (inclusive os do outro projeto que divide o
# servidor: atendagente*, cert-manager, kube-system), cifrada com `age` e enviada ao bucket protegido
# sob cluster-todos-namespaces/. Rede de segurança ANTES de operações arriscadas no k3s (por exemplo
# docs/runbooks/endurecer-k3s.md). NÃO é um backup recorrente: o backup recorrente é o `cluster-backup`
# (só o namespace consultor, permissão mínima).
#
# SEGURANÇA: cria permissões TEMPORÁRIAS de leitura de Secrets no cluster inteiro (ClusterRole). Use só
# quando precisar e REMOVA TUDO logo depois:
#   kubectl apply -f core/k8s/44-secrets-all-namespaces-export-once.yaml
#   kubectl logs job/secrets-export-once -n consultor
#   kubectl delete -f core/k8s/44-secrets-all-namespaces-export-once.yaml
# O job recusa rodar sem `age-recipient` (nunca envia Secret em claro) e trabalha em memória (RAM).
# Não exporta tokens de ServiceAccount. Os objetos ficam sob a retenção Object Lock do bucket (30 dias)
# e expiram pelo lifecycle (35 dias).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-export-once
  namespace: consultor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secrets-export-once
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secrets-export-once
subjects:
  - kind: ServiceAccount
    name: secrets-export-once
    namespace: consultor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secrets-export-once
---
apiVersion: batch/v1
kind: Job
metadata:
  name: secrets-export-once
  namespace: consultor
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: secrets-export-once
      restartPolicy: Never
      volumes:
        - name: work
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
      containers:
        - name: export
          image: alpine:3.20
          env:
            - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: backup-s3, key: access-key}}}
            - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: backup-s3, key: secret-key}}}
            - {name: S3_HOST, valueFrom: {secretKeyRef: {name: backup-s3, key: endpoint-host}}}
            - {name: AWS_DEFAULT_REGION, valueFrom: {secretKeyRef: {name: backup-s3, key: region}}}
            - {name: BUCKET, valueFrom: {secretKeyRef: {name: backup-s3, key: bucket-pg}}}
            - name: AGE_RECIPIENT
              valueFrom: {secretKeyRef: {name: backup-s3, key: age-recipient, optional: true}}
            - {name: AWS_REQUEST_CHECKSUM_CALCULATION, value: when_required}
            - {name: AWS_RESPONSE_CHECKSUM_VALIDATION, value: when_required}
            - {name: AWS_EC2_METADATA_DISABLED, value: "true"}
          volumeMounts:
            - {name: work, mountPath: /work}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 192Mi}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              [ -n "${AGE_RECIPIENT:-}" ] || { echo "ERRO: sem age-recipient; recuso exportar Secrets em texto claro"; exit 1; }
              apk add --no-cache curl jq aws-cli age > /dev/null
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              TOKEN=$(cat $SA/token)
              TS=$(date -u +%Y%m%dT%H%M%SZ)
              OUT="/work/$TS"; mkdir -p "$OUT"
              PREFIX="cluster-todos-namespaces/$(echo "$TS" | cut -c1-4)/$(echo "$TS" | cut -c5-6)/$(echo "$TS" | cut -c7-8)/$TS"
              ENDPOINT="https://$S3_HOST"

              curl -sS -f --cacert "$SA/ca.crt" -H "Authorization: Bearer $TOKEN" "https://kubernetes.default.svc/api/v1/secrets" | jq '{
                  apiVersion: "v1", kind: "List",
                  items: [ .items[]
                    | select(.type != "kubernetes.io/service-account-token")
                    | del(.metadata.uid, .metadata.resourceVersion, .metadata.creationTimestamp, .metadata.managedFields, .metadata.selfLink, .metadata.ownerReferences)
                    | del(.metadata.annotations["kubectl.kubernetes.io/last-applied-configuration"]) ] }' > "$OUT/secrets-todos-namespaces.json"
              TOTAL=$(jq '.items | length' "$OUT/secrets-todos-namespaces.json")
              [ "$TOTAL" -gt 0 ] || { echo "ERRO: nenhum Secret exportado"; exit 1; }
              echo "Secrets exportados por namespace (só contagem, nunca valores):"
              jq -r '.items | group_by(.metadata.namespace) | map("  \(.[0].metadata.namespace): \(length)") | .[]' "$OUT/secrets-todos-namespaces.json"
              echo "total: $TOTAL"
              printf '{"timestamp":"%s","total":%s}\n' "$TS" "$TOTAL" > "$OUT/manifest.json"

              RARGS=""
              for r in $(echo "$AGE_RECIPIENT" | tr ',' ' '); do RARGS="$RARGS -r $r"; done
              for f in "$OUT"/*; do
                # shellcheck disable=SC2086
                age $RARGS -o "$f.age" "$f"
                [ -s "$f.age" ] || { echo "ERRO: falha ao criptografar $f"; exit 1; }
                rm "$f"
              done
              ( cd "$OUT" && sha256sum ./* > SHA256SUMS )
              for f in "$OUT"/*; do
                name=$(basename "$f")
                aws s3 cp "$f" "s3://$BUCKET/$PREFIX/$name" --endpoint-url "$ENDPOINT" --only-show-errors
                remote=$(aws s3api head-object --bucket "$BUCKET" --key "$PREFIX/$name" --endpoint-url "$ENDPOINT" --query ContentLength --output text)
                [ "$remote" = "$(stat -c %s "$f")" ] || { echo "ERRO: tamanho diferente em $name"; exit 1; }
              done
              echo "exportação ok em s3://$BUCKET/$PREFIX"
