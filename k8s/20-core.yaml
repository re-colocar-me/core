apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
  namespace: consultor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core
  template:
    metadata:
      labels:
        app: core
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: core
          image: ghcr.io/re-colocar-me/core:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: Elasticsearch__Uri
              value: "http://elasticsearch:9200"
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  name: core-secrets
                  key: connection-string
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: core-secrets
                  key: jwt-secret
            - name: Jwt__Issuer
              value: re.colocarme.core
            - name: Jwt__Audience
              value: re.colocarme
            - name: Jwt__ExpirationMinutes
              value: "60"
            - name: LinkedinOptions__ClientId
              value: "77dcc8zl3nnoku"
            - name: LinkedinOptions__Secret
              valueFrom:
                secretKeyRef:
                  name: core-secrets
                  key: linkedin-secret
            - name: LinkedinOptions__RedirectUri
              value: "https://consultor-re.colocar-me.com.br/linkedin"
            # appsettings.json de produção não tem LinkedinOptions nenhum (só
            # appsettings.Development.json, que nunca é publicado) — sem estes 3, GetAuthTokenPath
            # ficava null e o POST caía na raiz do linkedin.com em vez do endpoint de token.
            - name: LinkedinOptions__BaseAddress
              value: "https://www.linkedin.com/"
            - name: LinkedinOptions__ApiBaseAddress
              value: "https://api.linkedin.com/"
            - name: LinkedinOptions__GetAuthTokenPath
              value: "/oauth/v2/accessToken"
            - name: LinkedinOptions__GetProfilePath
              value: "/v2/userinfo"
            # Sugestões de IA (bio/apresentação/skills) passaram a rotear pelo Hermes Agent
            # (gateway próprio, k3s na Hetzner) em vez de bater direto na API da Anthropic —
            # ver core.infrastructure/ExternalServices/Hermes/HermesAgentClient.cs.
            - name: HermesAgentOptions__Model
              value: hermes-agent
            - name: HermesAgentOptions__BaseAddress
              value: "https://bot.colocar-me.com.br/agent-api/"
            - name: HermesAgentOptions__ApiKey
              valueFrom:
                secretKeyRef:
                  name: core-secrets
                  key: hermes-agent-api-key
            # RabbitMQ real no mesmo namespace (ver k8s/10-rabbitmq.yaml) — DNS interno do cluster.
            - name: RabbitMQ__Host
              value: "rabbitmq"
            - name: RabbitMQ__UserName
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: username
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: core
  namespace: consultor
spec:
  selector:
    app: core
  ports:
    - port: 8080
      targetPort: 8080
