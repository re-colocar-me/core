apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
  namespace: recolocarme
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core
  template:
    metadata:
      labels:
        app: core
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: core
          image: ghcr.io/re-colocar-me/core:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: Elasticsearch__Uri
              value: "http://elasticsearch:9200"
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  name: core-secrets
                  key: connection-string
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: core-secrets
                  key: jwt-secret
            - name: Jwt__Issuer
              value: re.colocarme.core
            - name: Jwt__Audience
              value: re.colocarme
            - name: Jwt__ExpirationMinutes
              value: "60"
            - name: LinkedinOptions__ClientId
              value: "77dcc8zl3nnoku"
            - name: LinkedinOptions__Secret
              valueFrom:
                secretKeyRef:
                  name: core-secrets
                  key: linkedin-secret
            - name: LinkedinOptions__RedirectUri
              value: "https://consultor-re.colocar-me.com.br/linkedin"
            # appsettings.json de produção não tem LinkedinOptions nenhum (só
            # appsettings.Development.json, que nunca é publicado) — sem estes 3, GetAuthTokenPath
            # ficava null e o POST caía na raiz do linkedin.com em vez do endpoint de token.
            - name: LinkedinOptions__BaseAddress
              value: "https://www.linkedin.com/"
            - name: LinkedinOptions__ApiBaseAddress
              value: "https://api.linkedin.com/"
            - name: LinkedinOptions__GetAuthTokenPath
              value: "/oauth/v2/accessToken"
            - name: LinkedinOptions__GetProfilePath
              value: "/v2/userinfo"
            # Sugestões de IA (bio/apresentação/skills) passaram a rotear pelo Hermes Agent
            # (gateway próprio, k3s na Hetzner) em vez de bater direto na API da Anthropic —
            # ver core.infrastructure/ExternalServices/Hermes/HermesAgentClient.cs.
            - name: HermesAgentOptions__Model
              value: hermes-agent
            - name: HermesAgentOptions__BaseAddress
              value: "http://hermes.hermes-recolocarme.svc.cluster.local:8642/"
            - name: HermesAgentOptions__ApiKey
              valueFrom:
                secretKeyRef:
                  name: core-secrets
                  key: hermes-agent-api-key
            # RabbitMQ real no mesmo namespace (ver k8s/10-rabbitmq.yaml) — DNS interno do cluster.
            - name: RabbitMQ__Host
              value: "rabbitmq"
            - name: RabbitMQ__UserName
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: username
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: password
            # O aviso por e-mail e push ao talento dos convites recebidos (docs/specs/ponte-talento-consultor.md, seção 33). DESLIGADO de propósito:
            # só ligar depois de o tipo talento.convite-recebido estar publicado no catálogo do motor e de o texto do e-mail ter sido lido pelo fundador.
            - name: InviteNotices__Enabled
              value: "false"
            # Os avisos por e-mail das conversas da ponte (mão levantada, proposta, aceite, expiração e encerramento; seção 38). DESLIGADO de propósito: só ligar depois de os seis tipos
            # estarem publicados no catálogo do motor e de os textos terem sido lidos pelo fundador.
            - name: ConversationNotices__Enabled
              value: "false"
            # A EXECUÇÃO da exclusão de conta do consultor (docs/specs/exclusao-de-conta-consultor.md, EC2): irreversível, DESLIGADA de propósito. Só ligar depois da EC3, da confirmação do contador (D-EC3) e de
            # provar o apagador em Postgres real. Existe além da trava do consultant-bff (AccountDeletion__Enabled).
            - name: ConsultantDeletion__ExecutionEnabled
              value: "false"
            # A sessão em vídeo (docs/specs/sessao-em-video-e-chat.md). A migração AddSessions (docs/operacao/2026-11-25/migracao-AddSessions.sql) tem de ser aplicada à mão ANTES de publicar este core,
            # mesmo com a chave desligada: a exclusão de contas já lê as tabelas novas.
            - name: Sessions__Enabled
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: core
  namespace: recolocarme
spec:
  selector:
    app: core
  ports:
    - port: 8080
      targetPort: 8080
