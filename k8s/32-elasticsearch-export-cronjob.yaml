# Backup do Elasticsearch por EXPORTAÇÃO NDJSON (não por snapshot: a Hetzner não passa na análise
# de repositório do ES 8.17.6; ver docs/specs/backup-elasticsearch-postgres.md seção 9).
#
# Para cada índice crítico grava: <índice>.settings.json, <índice>.mapping.json e
# <índice>.docs.ndjson (pronto para `_bulk`: uma linha de ação + uma de documento), mais um
# manifest.json com a contagem de documentos e o SHA256SUMS. Os objetos salvos do Kibana
# (dashboards etc.) vão em kibana-objects.ndjson (best-effort). Tudo é criptografado com `age` (mesmas
# chaves do backup do Postgres) e enviado ao MESMO bucket protegido (`bucket-pg`, com Object Lock e
# lifecycle), sob o prefixo elasticsearch/AAAA/MM/DD/<timestamp>/. O restore está em
# k8s/42-elasticsearch-restore-test-job.yaml e em docs/runbooks/restauracao-postgres-e-elasticsearch.md.
#
# Índices cobertos: emails-*, swot-analysis, linkedin-profile-suggestion, skill-gap-analysis.
# Logs e métricas ficam de fora de propósito (descartáveis). Índice que ainda não existe (por exemplo
# emails-* antes de o core-emails ser implantado) é simplesmente ignorado.
#
# NÃO é aplicado pelo CI do `core`. Aplicar à mão, com o Secret `backup-s3` existente:
#   kubectl apply -f core/k8s/32-elasticsearch-export-cronjob.yaml
# Disparar um teste sem esperar o horário:
#   kubectl create job --from=cronjob/elasticsearch-export es-export-manual-1 -n consultor
#
# Horário: a cada 6 horas às 00:50, 06:50, 12:50 e 18:50 UTC (20 minutos depois do dump do Postgres).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: elasticsearch-export
  namespace: consultor
spec:
  schedule: "50 */6 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          volumes:
            - name: work
              emptyDir: {}
          containers:
            - name: export
              image: alpine:3.20
              env:
                - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: backup-s3, key: access-key}}}
                - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: backup-s3, key: secret-key}}}
                - {name: S3_HOST, valueFrom: {secretKeyRef: {name: backup-s3, key: endpoint-host}}}
                - {name: AWS_DEFAULT_REGION, valueFrom: {secretKeyRef: {name: backup-s3, key: region}}}
                - {name: BUCKET, valueFrom: {secretKeyRef: {name: backup-s3, key: bucket-pg}}}
                - name: AGE_RECIPIENT
                  valueFrom: {secretKeyRef: {name: backup-s3, key: age-recipient, optional: true}}
                - {name: ES_URL, value: "http://elasticsearch:9200"}
                - {name: KIBANA_URL, value: "http://kibana:5601"}
                - {name: INDEX_PATTERNS, value: "emails-*,swot-analysis,linkedin-profile-suggestion,skill-gap-analysis"}
                - {name: AWS_REQUEST_CHECKSUM_CALCULATION, value: when_required}
                - {name: AWS_RESPONSE_CHECKSUM_VALIDATION, value: when_required}
                - {name: AWS_EC2_METADATA_DISABLED, value: "true"}
              volumeMounts:
                - {name: work, mountPath: /work}
              resources:
                requests: {cpu: 50m, memory: 96Mi}
                limits: {cpu: 500m, memory: 384Mi}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  apk add --no-cache curl jq aws-cli age > /dev/null

                  START=$(date +%s)
                  STATUS=failed
                  COUNT=0
                  BYTES=0
                  NINDEX=0
                  NDOCS=0
                  KIBANA=false
                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  OUT="/work/$TS"
                  mkdir -p "$OUT"
                  PREFIX="elasticsearch/$(echo "$TS" | cut -c1-4)/$(echo "$TS" | cut -c5-6)/$(echo "$TS" | cut -c7-8)/$TS"
                  ENDPOINT="https://$S3_HOST"

                  # Registra sucesso ou falha no índice backup-status (best-effort), em qualquer saída.
                  post_status() {
                    curl -s -m 10 -X POST -H 'Content-Type: application/json' "$ES_URL/backup-status/_doc" \
                      -d "{\"@timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"target\":\"elasticsearch\",\"status\":\"$STATUS\",\"files\":$COUNT,\"bytes\":$BYTES,\"indices\":$NINDEX,\"docs\":$NDOCS,\"kibana_objects\":$KIBANA,\"duration_seconds\":$(( $(date +%s) - START )),\"prefix\":\"$PREFIX\",\"encrypted\":$([ -n "${AGE_RECIPIENT:-}" ] && echo true || echo false)}" \
                      > /dev/null || echo "aviso: não consegui registrar o status no Elasticsearch"
                  }
                  trap post_status EXIT

                  # 1) Descobre quais índices existem (padrão sem correspondência é ignorado).
                  INDICES=$(curl -sS -f "$ES_URL/_resolve/index/$INDEX_PATTERNS?expand_wildcards=open" | jq -r '.indices[].name' | sort)
                  echo "índices encontrados: $(echo "$INDICES" | tr '\n' ' ')"

                  # 2) Exporta cada índice: configurações, mapeamento e documentos (via scroll, em disco).
                  for idx in $INDICES; do
                    echo "exportando $idx"
                    # Configurações sem os campos que o ES gera sozinho.
                    curl -sS -f "$ES_URL/$idx/_settings" | jq --arg i "$idx" '.[$i].settings.index | del(.uuid,.creation_date,.provided_name,.version,.routing,.resize,.blocks)' > "$OUT/$idx.settings.json"
                    curl -sS -f "$ES_URL/$idx/_mapping"  | jq --arg i "$idx" '.[$i].mappings' > "$OUT/$idx.mapping.json"

                    : > "$OUT/$idx.docs.ndjson"
                    resp=$(curl -sS -f -X POST -H 'Content-Type: application/json' "$ES_URL/$idx/_search?scroll=2m&size=1000" -d '{"query":{"match_all":{}},"sort":["_doc"]}')
                    scroll_id=$(echo "$resp" | jq -r '._scroll_id')
                    total=$(echo "$resp" | jq -r '.hits.total.value')
                    n=0
                    while :; do
                      hits=$(echo "$resp" | jq '.hits.hits | length')
                      [ "$hits" -gt 0 ] || break
                      # Formato pronto para _bulk: linha de ação (com o _id) e linha do documento.
                      echo "$resp" | jq -c '.hits.hits[] | ({"index":{"_id":._id}}, ._source)' >> "$OUT/$idx.docs.ndjson"
                      n=$((n + hits))
                      resp=$(curl -sS -f -X POST -H 'Content-Type: application/json' "$ES_URL/_search/scroll" -d "{\"scroll\":\"2m\",\"scroll_id\":\"$scroll_id\"}")
                    done
                    curl -s -X DELETE -H 'Content-Type: application/json' "$ES_URL/_search/scroll" -d "{\"scroll_id\":\"$scroll_id\"}" > /dev/null || true

                    lines=$(wc -l < "$OUT/$idx.docs.ndjson")
                    [ "$lines" -eq $((n * 2)) ] || { echo "ERRO: $idx: $lines linhas para $n documentos"; exit 1; }
                    echo "  $idx: $n documentos exportados (total informado pelo ES: $total)"
                    NINDEX=$((NINDEX + 1)); NDOCS=$((NDOCS + n))
                    printf '{"index":"%s","docs":%s,"es_total":%s}\n' "$idx" "$n" "$total" >> "$OUT/manifest.lines"
                  done
                  if [ -f "$OUT/manifest.lines" ]; then jq -s '.' "$OUT/manifest.lines" > "$OUT/manifest.json"; rm "$OUT/manifest.lines"; else echo '[]' > "$OUT/manifest.json"; fi

                  # 3) Objetos salvos do Kibana (dashboards, visualizações, índices de dados...). Best-effort.
                  if curl -sS -f -X POST -H 'kbn-xsrf: true' -H 'Content-Type: application/json' "$KIBANA_URL/api/saved_objects/_export" \
                       -d '{"type":["dashboard","visualization","lens","search","index-pattern","map","config"],"includeReferencesDeep":true}' \
                       -o "$OUT/kibana-objects.ndjson" 2>/dev/null; then
                    KIBANA=true; echo "objetos do Kibana exportados"
                  else
                    rm -f "$OUT/kibana-objects.ndjson"; echo "aviso: não consegui exportar os objetos do Kibana (best-effort)"
                  fi

                  # 4) Criptografa com age (várias chaves separadas por vírgula), se configurado.
                  if [ -n "${AGE_RECIPIENT:-}" ]; then
                    RARGS=""
                    for r in $(echo "$AGE_RECIPIENT" | tr ',' ' '); do RARGS="$RARGS -r $r"; done
                    for f in "$OUT"/*; do
                      # shellcheck disable=SC2086
                      age $RARGS -o "$f.age" "$f"
                      [ -s "$f.age" ] || { echo "ERRO: falha ao criptografar $f"; exit 1; }
                      rm "$f"
                    done
                  fi
                  ( cd "$OUT" && sha256sum ./* > SHA256SUMS )

                  # 5) Envia e confere o tamanho de cada objeto no bucket.
                  for f in "$OUT"/*; do
                    name=$(basename "$f")
                    aws s3 cp "$f" "s3://$BUCKET/$PREFIX/$name" --endpoint-url "$ENDPOINT" --only-show-errors
                    remote=$(aws s3api head-object --bucket "$BUCKET" --key "$PREFIX/$name" --endpoint-url "$ENDPOINT" --query ContentLength --output text)
                    local_size=$(stat -c %s "$f")
                    [ "$remote" = "$local_size" ] || { echo "ERRO: tamanho diferente em $name (local $local_size, remoto $remote)"; exit 1; }
                    COUNT=$((COUNT + 1)); BYTES=$((BYTES + local_size))
                  done

                  STATUS=ok
                  echo "backup do ES ok: $NINDEX índices, $NDOCS documentos, $COUNT arquivos, $BYTES bytes em s3://$BUCKET/$PREFIX"
