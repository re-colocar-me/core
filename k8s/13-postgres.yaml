# ConfigMap com o script que cria os 6 databases no primeiro boot (mesmo conteúdo de
# docs/postgres-init/create-databases.sh, usado pelo docker-compose local — manter os dois em
# sincronia se a lista de databases mudar).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: consultor
data:
  create-databases.sh: |
    #!/bin/bash
    set -e

    for db in ReColocarMe ReColocarMeVocacional ReColocarMeWallet ReColocarMeBackoffice ReColocarMePromoCodes ReColocarMeTalent; do
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
        SELECT 'CREATE DATABASE "$db"' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$db')\gexec
    EOSQL
    done
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: consultor
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: consultor
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: postgres-password
            - name: PGDATA
              # Subpasta, não a raiz do mount — volumes Azure Disk costumam vir com um
              # `lost+found` na raiz, e o initdb do Postgres recusa inicializar num diretório
              # que já tem qualquer coisa dentro.
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-init
          configMap:
            name: postgres-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
