# VERIFICAÇÃO do backup do cluster. Baixa o backup mais recente (`cluster/`), confere o SHA256SUMS,
# descriptografa e COMPARA cada Secret do backup com o Secret vivo no cluster (mesmo conteúdo?), e lista
# Secrets vivos que não estão no backup. NÃO grava nada no cluster (só leitura); os valores nunca são
# impressos: só nomes e o veredito (igual / diferente / ausente). Ver docs/runbooks/reconstruir-cluster.md.
#
# Precisa da chave PRIVADA age, que nunca deve morar no cluster: crie um Secret TEMPORÁRIO num terminal
# seu (fora do Claude Code), rode o teste e apague:
#   kubectl create secret generic age-identity -n consultor --from-file=key=./chave-privada-age.txt
#   kubectl delete job cluster-backup-verify -n consultor --ignore-not-found
#   kubectl create -f core/k8s/43-cluster-backup-verify-job.yaml
#   kubectl logs job/cluster-backup-verify -n consultor
#   kubectl delete secret age-identity -n consultor
apiVersion: batch/v1
kind: Job
metadata:
  name: cluster-backup-verify
  namespace: consultor
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: cluster-backup
      restartPolicy: Never
      volumes:
        - name: work
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
      containers:
        - name: verify
          image: alpine:3.20
          env:
            - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: backup-s3, key: access-key}}}
            - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: backup-s3, key: secret-key}}}
            - {name: S3_HOST, valueFrom: {secretKeyRef: {name: backup-s3, key: endpoint-host}}}
            - {name: AWS_DEFAULT_REGION, valueFrom: {secretKeyRef: {name: backup-s3, key: region}}}
            - {name: BUCKET, valueFrom: {secretKeyRef: {name: backup-s3, key: bucket-pg}}}
            - name: AGE_IDENTITY
              valueFrom: {secretKeyRef: {name: age-identity, key: key, optional: true}}
            - {name: AWS_REQUEST_CHECKSUM_CALCULATION, value: when_required}
            - {name: AWS_RESPONSE_CHECKSUM_VALIDATION, value: when_required}
            - {name: AWS_EC2_METADATA_DISABLED, value: "true"}
          volumeMounts:
            - {name: work, mountPath: /work}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 192Mi}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache curl jq aws-cli age > /dev/null
              E="https://$S3_HOST"
              KEY=$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix cluster/ --endpoint-url "$E" --query 'sort_by(Contents,&LastModified)[-1].Key' --output text)
              [ -n "$KEY" ] && [ "$KEY" != "None" ] || { echo "ERRO: nenhum backup do cluster no bucket"; exit 1; }
              DIR=$(dirname "$KEY")
              echo "backup mais recente: s3://$BUCKET/$DIR/"
              mkdir -p /work/b && cd /work/b
              aws s3 cp "s3://$BUCKET/$DIR/" . --recursive --endpoint-url "$E" --only-show-errors
              sha256sum -c SHA256SUMS
              [ -n "${AGE_IDENTITY:-}" ] || { echo "ERRO: sem Secret age-identity (ver o cabeçalho deste arquivo); a integridade acima passou, mas o conteúdo não foi verificado"; exit 2; }
              printf '%s\n' "$AGE_IDENTITY" > /work/identity.txt; chmod 600 /work/identity.txt
              for f in ./*.age; do age -d -i /work/identity.txt -o "${f%.age}" "$f"; done
              rm -f /work/identity.txt ./*.age
              echo "manifest: $(cat manifest.json)"

              SA=/var/run/secrets/kubernetes.io/serviceaccount
              NS=$(cat $SA/namespace); TOKEN=$(cat $SA/token)
              curl -sS -f --cacert "$SA/ca.crt" -H "Authorization: Bearer $TOKEN" "https://kubernetes.default.svc/api/v1/namespaces/$NS/secrets" \
                | jq -c '.items[] | select(.type != "kubernetes.io/tls" and .type != "kubernetes.io/service-account-token") | select(.metadata.name != "age-identity") | {name: .metadata.name, type, data: (.data // {})}' | sort > /work/live.ndjson
              jq -c '.items[] | {name: .metadata.name, type, data: (.data // {})}' secrets.json | sort > /work/backup.ndjson

              FAIL=0
              echo "--- comparação (Secret do backup x Secret vivo)"
              while IFS= read -r line; do
                name=$(echo "$line" | jq -r '.name')
                live=$(grep -F "\"name\":\"$name\"" /work/live.ndjson || true)
                if [ -z "$live" ]; then echo "  AUSENTE no cluster: $name"; FAIL=1
                elif [ "$(echo "$line" | jq -cS .)" = "$(echo "$live" | jq -cS .)" ]; then echo "  igual:     $name"
                else echo "  DIFERENTE: $name (alterado depois do backup? Secrets mudam de vez em quando)"; fi
              done < /work/backup.ndjson
              echo "--- Secrets vivos que NÃO estão no backup"
              while IFS= read -r line; do
                name=$(echo "$line" | jq -r '.name')
                grep -qF "\"name\":\"$name\"" /work/backup.ndjson || { echo "  FALTA no backup: $name"; FAIL=1; }
              done < /work/live.ndjson
              [ "$FAIL" = "0" ] && echo "VERIFICAÇÃO DO BACKUP DO CLUSTER: OK" || echo "VERIFICAÇÃO DO BACKUP DO CLUSTER: HÁ DIVERGÊNCIAS (ver acima)"
              exit $FAIL
