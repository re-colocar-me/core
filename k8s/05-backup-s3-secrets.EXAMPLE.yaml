# Template só pra documentar as chaves necessárias — NUNCA aplicar este arquivo como está
# (valores fake) nem commitar a versão real preenchida. O Secret de verdade é criado pelo
# fundador num TERMINAL SEPARADO, fora do Claude Code (nada de colar chave no chat nem usar `!`),
# no servidor do k3s, por exemplo:
#
#   export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
#   read -rs S3_SECRET_KEY        # cola a chave e Enter; não aparece na tela nem no histórico
#   kubectl create secret generic backup-s3 -n consultor \
#     --from-literal=access-key='<access key da chave de BACKUP>' \
#     --from-literal=secret-key="$S3_SECRET_KEY" \
#     --from-literal=endpoint-host='fsn1.your-objectstorage.com' \
#     --from-literal=region='fsn1' \
#     --from-literal=bucket-pg='<bucket do Postgres, com Object Lock>' \
#     --from-literal=bucket-es='<bucket do Elasticsearch>' \
#     --from-literal=age-recipient='<chave PÚBLICA age, opcional>'
#   unset S3_SECRET_KEY
#
# Use uma chave S3 PRÓPRIA dos jobs de backup, separada da chave da aplicação (as chaves da
# Hetzner valem por padrão pra todos os buckets do projeto; ver docs/specs/backup-elasticsearch-postgres.md).
apiVersion: v1
kind: Secret
metadata:
  name: backup-s3
  namespace: consultor
type: Opaque
stringData:
  access-key: "TROCAR — access key S3 da chave de backup (Hetzner Object Storage)"
  secret-key: "TROCAR — secret key S3 da chave de backup"
  endpoint-host: "fsn1.your-objectstorage.com"
  region: "fsn1"
  bucket-pg: "TROCAR — bucket dos dumps do Postgres (criado com Object Lock)"
  bucket-es: "TROCAR — bucket dos snapshots do Elasticsearch (sem Object Lock)"
  # Opcional. Chave PÚBLICA do `age` (age1...). Se preenchida, os dumps são criptografados antes do
  # upload; a chave PRIVADA fica offline com o fundador (sem ela o dump não abre). Vazia = sem cifra.
  age-recipient: ""
