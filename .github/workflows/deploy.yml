name: Deploy to k3s

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # OIDC para assumir o papel IAM do deploy
    steps:
      - name: Checkout core
        uses: actions/checkout@v4
        with:
          path: core

      # core.csproj referencia core.domain/core.infrastructure via ProjectReference relativo —
      # precisam ser checados lado a lado como repos irmãos pro build funcionar.
      - name: Checkout core.domain
        uses: actions/checkout@v4
        with:
          repository: re-colocar-me/core.domain
          path: core.domain
          token: ${{ secrets.ORG_REPO_ACCESS_TOKEN }}

      - name: Checkout core.infrastructure
        uses: actions/checkout@v4
        with:
          repository: re-colocar-me/core.infrastructure
          path: core.infrastructure
          token: ${{ secrets.ORG_REPO_ACCESS_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -f core/Dockerfile -t ghcr.io/re-colocar-me/core:${{ github.sha }} -t ghcr.io/re-colocar-me/core:latest .
          docker push ghcr.io/re-colocar-me/core:${{ github.sha }}
          docker push ghcr.io/re-colocar-me/core:latest

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::492715478912:role/recolocarme-staging-github-deploy
          aws-region: sa-east-1

      # A 6443 do no NAO e aberta a internet: o job abre um tunel do Session Manager ate ela e o kubectl usa 127.0.0.1:16443.
      - name: Install Session Manager plugin
        run: |
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/ssm-plugin.deb
          sudo dpkg -i /tmp/ssm-plugin.deb > /dev/null

      - name: Open SSM tunnel to the cluster API
        run: |
          ID=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=recolocarme-staging-recolocarme" "Name=instance-state-name,Values=running" --query "Reservations[0].Instances[0].InstanceId" --output text)
          [ -n "$ID" ] && [ "$ID" != "None" ] || { echo "no do cluster nao encontrado"; exit 1; }
          nohup aws ssm start-session --target "$ID" --document-name AWS-StartPortForwardingSession --parameters '{"portNumber":["6443"],"localPortNumber":["16443"]}' > /tmp/ssm-tunnel.log 2>&1 &
          for i in $(seq 1 40); do (echo > /dev/tcp/127.0.0.1/16443) 2>/dev/null && exit 0; sleep 1; done
          echo "tunel SSM nao abriu:"; cat /tmp/ssm-tunnel.log; exit 1

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Apply manifests and roll out new image
        run: |
          kubectl apply -f core/k8s/20-core.yaml
          kubectl set image deployment/core core=ghcr.io/re-colocar-me/core:${{ github.sha }} -n recolocarme
          kubectl rollout status deployment/core -n recolocarme --timeout=180s
